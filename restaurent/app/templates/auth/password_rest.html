<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8f5f2;
        }

        .reset-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .reset-container h1 {
            color: #2f6f68;
            margin-bottom: 10px;
        }

        .reset-container p {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #6fb8ae;
        }

        .submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #5fa99f;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit:hover {
            background: #478f86;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #5fa99f;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="reset-container">

        <h1>Reset Password</h1>

        <p>
            Enter your email address and we'll send you a link
            to reset your password.
        </p>

        <form method="POST" action="">
            {% csrf_token %}

            {{ form }}

            <button type="submit" class="submit">
                RESET MY PASSWORD
            </button>
        </form>


</body>
</html>
